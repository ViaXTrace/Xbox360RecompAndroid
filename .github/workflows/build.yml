name: Build & Release

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  FLUTTER_VERSION: '3.22.0'
  NDK_VERSION: '26.3.11579264'
  JAVA_VERSION: '17'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Set up Android NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;${{ env.NDK_VERSION }}" \
            "cmake;3.22.1" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.x'

      - name: Generate app icons from SVG
        run: |
          sudo apt-get install -y librsvg2-bin 2>/dev/null || true
          if command -v rsvg-convert &>/dev/null && [ -f assets/icons/app_icon.svg ]; then
            for density in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              name="${density%%:*}"
              size="${density##*:}"
              rsvg-convert -w $size -h $size assets/icons/app_icon.svg \
                -o android/app/src/main/res/mipmap-${name}/ic_launcher.png
              echo "Generated mipmap-${name}/ic_launcher.png (${size}px)"
            done
          else
            echo "rsvg-convert not available or SVG not found, keeping existing icons"
          fi

      - name: Generate android/local.properties
        run: |
          FLUTTER_SDK_PATH=$(dirname $(dirname $(which flutter)))
          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          flutter.sdk=$FLUTTER_SDK_PATH
          flutter.versionCode=1
          flutter.versionName=0.1.0
          EOF
          echo "--- local.properties ---"
          cat android/local.properties

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache NDK build
        uses: actions/cache@v4
        with:
          path: android/.cxx
          key: ${{ runner.os }}-ndk-${{ hashFiles('android/CMakeLists.txt', 'native/**/*.cpp', 'native/**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Set up keystore (release builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --no-shrink \
            --dart-define=COMMIT_SHA=${{ github.sha }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Build debug APK (non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          flutter build apk \
            --debug \
            --target-platform android-arm64 \
            --dart-define=COMMIT_SHA=${{ github.sha }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Rename APK artifacts
        run: |
          mkdir -p dist
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
               dist/Xbox360RecompAndroid-${{ github.ref_name }}-arm64.apk
          else
            cp build/app/outputs/flutter-apk/app-debug.apk \
               dist/Xbox360RecompAndroid-dev${{ github.run_number }}-debug-arm64.apk
          fi
          echo "--- dist contents ---"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: dist/*.apk
          retention-days: 30

      - name: Create dev pre-release (main branch builds)
        if: "github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "🔧 Dev Build #${{ github.run_number }}"
          prerelease: true
          make_latest: false
          files: dist/*.apk
          body: |
            ## 🔧 Automated Dev Build

            **Build:** #${{ github.run_number }}
            **Commit:** [`${{ github.sha }}`](https://github.com/ViaXTrace/Xbox360RecompAndroid/commit/${{ github.sha }})
            **Branch:** `main`
            **Date:** ${{ github.event.head_commit.timestamp }}

            This is an **unstable debug build** generated automatically from the latest commit on `main`.
            Use [official releases](https://github.com/ViaXTrace/Xbox360RecompAndroid/releases?q=v&expanded=true) for stable versions.

            ### What's in this build
            ${{ github.event.head_commit.message }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: dist
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^dev-" | grep -A1 "$TAG" | tail -1)
          echo "## Changes in $TAG" > changelog.md
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" >> changelog.md
          else
            git log --pretty=format:"- %s (%h)" -20 >> changelog.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Xbox360RecompAndroid ${{ github.ref_name }}
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          make_latest: true
          files: dist/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compat-db-validate:
    name: Validate Compatibility Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate games.json
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('compat/games.json', 'utf8'));
            console.log('✅ compat/games.json is valid JSON');
            console.log('📊 Games in database:', data.games.length);
          "
