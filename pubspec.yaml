name: xbox360recomp_android
description: Universal Xbox 360 → Android recompiler with dynamic PowerPC JIT, HLE and Xenos→Vulkan GPU layer.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  material_design_icons_flutter: ^7.0.7296
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  lottie: ^3.1.0
  animated_text_kit: ^4.2.2

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Storage & persistence
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3

  # File handling
  file_picker: ^8.0.3
  permission_handler: ^11.3.1
  archive: ^3.6.1
  crypto: ^3.0.3
  convert: ^3.1.1
  mime: ^1.0.5

  # Network
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Gaming & input
  gamepads: ^0.1.7
  ffi: ^2.1.0

  # System info
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  battery_plus: ^6.0.1

  # Utilities
  collection: ^1.18.0
  intl: ^0.19.0
  logger: ^2.3.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/shaders/
    - assets/compat/
  fonts:
    - family: XboxFont
      fonts:
        - asset: assets/fonts/XboxOne-Regular.ttf